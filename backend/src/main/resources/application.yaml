spring:
  application:
    name: precificacao

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    # Necessário para aplicar a V0_9 (tabelas base) em bancos que já têm V1 e V2.
    out-of-order: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origin: "${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}"
# Integração com o iFood (aplicativo centralizado). Sem as variáveis, o sistema
# sobe normalmente; só as funções que falam com o iFood ficam indisponíveis.
ifood:
  client-id: ${IFOOD_CLIENT_ID:}
  client-secret: ${IFOOD_CLIENT_SECRET:}
  base-url: ${IFOOD_BASE_URL:https://merchant-api.ifood.com.br}
  fuso: America/Sao_Paulo
