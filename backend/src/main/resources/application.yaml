spring:
  application:
    name: precificacao

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origin: "${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}"