spring:
  application:
    name: precificacao

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    # Necessário para aplicar a V0_9 (tabelas base) em bancos que já têm V1 e V2.
    out-of-order: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origin: "${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}"
# Integração com o iFood (aplicativo centralizado). Sem as variáveis, o sistema
# sobe normalmente; só as funções que falam com o iFood ficam indisponíveis.
ifood:
  client-id: ${IFOOD_CLIENT_ID:}
  client-secret: ${IFOOD_CLIENT_SECRET:}
  base-url: ${IFOOD_BASE_URL:https://merchant-api.ifood.com.br}
  fuso: America/Sao_Paulo

# Monitor de lojas. Começa DESLIGADO; e, ligado, começa em "modo sombra"
# (calcula e registra as mensagens, mas não envia), para comparar com o monitor em Python.
monitor:
  ativo: ${MONITOR_ATIVO:false}
  enviar-whatsapp: ${MONITOR_ENVIAR_WHATSAPP:false}
  intervalo-segundos: ${MONITOR_INTERVALO_SEGUNDOS:30}
  ciclos-confirmacao: 2
  estados-alerta: ERROR
  alertar-pausas: true
  lembrete-minutos: ${MONITOR_LEMBRETE_MINUTOS:30}
  avisar-recuperacao: true
  workers: ${MONITOR_WORKERS:8}
  resumo-diario: "${MONITOR_RESUMO_DIARIO:08:00}"

whatsapp:
  provider: ${WHATSAPP_PROVIDER:console}
  zapi-instance-id: ${ZAPI_INSTANCE_ID:}
  zapi-token: ${ZAPI_TOKEN:}
  zapi-client-token: ${ZAPI_CLIENT_TOKEN:}
  evolution-url: ${EVOLUTION_URL:}
  evolution-api-key: ${EVOLUTION_API_KEY:}
  evolution-instancia: ${EVOLUTION_INSTANCIA:monitor}
