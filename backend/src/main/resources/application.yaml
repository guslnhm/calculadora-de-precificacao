spring:
  application:
    name: precificacao

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    # Necessário para aplicar a V0_9 (tabelas base) em bancos que já têm V1 e V2.
    out-of-order: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origin: "${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}"