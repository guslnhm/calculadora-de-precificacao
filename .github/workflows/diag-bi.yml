name: Diag banco do BI
on:
  push:
    branches: [diag/bi-schema]
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler estrutura e amostras (saída criptografada)
        env:
          BI_URL_BASE: ${{ secrets.BI_DATABASE_URL }}
        run: |
          export BI_DATABASE_URL=$(echo "$BI_URL_BASE" | sed -E 's#/[^/?]+(\?|$)#/pedidos\1#')
          test -n "$BI_DATABASE_URL" || { echo "secret BI_DATABASE_URL vazio"; exit 1; }
          cat > q.sql <<'SQL'
          \pset pager off
          \echo === faltando ===
          SELECT o.id_operacao, l.nome_loja, o.nome_operacao, string_agg(DISTINCT a.id_loja_origem, ',') ids,
                 g.data_inicio, g.qtd_pedidos, m.valor_bruto, m.valor_liquido, m.recebido_via_loja, m.repassado_plataforma, m.conversao
          FROM gold.financeiro_periodo g
          JOIN silver.dim_operacao o ON o.id_operacao = g.id_operacao
          JOIN silver.dim_loja l ON l.id_loja = o.id_loja
          LEFT JOIN silver.dim_operacao_alias a ON a.id_operacao = o.id_operacao AND a.id_plataforma = 1
          LEFT JOIN silver.fato_metricas_periodo m USING (id_operacao, id_plataforma, periodo_tipo, data_inicio)
          WHERE g.periodo_tipo = 'SEMANAL' AND g.id_plataforma = 1 AND g.data_inicio >= '2026-10-19'
          GROUP BY 1,2,3,5,6,7,8,9,10,11 ORDER BY 2,3,5;
          SQL
          docker run --rm -e BI_DATABASE_URL -v "$PWD:/w" postgres:18 \
            sh -c 'psql "$BI_DATABASE_URL" -X -f /w/q.sql > /w/saida.txt 2>&1 || true'
          openssl rand -hex 32 > k.txt
          gzip -9 -k saida.txt; openssl enc -aes-256-cbc -pbkdf2 -salt -in saida.txt.gz -out saida.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/diag/diag-pub.pem -in k.txt -out k.enc
          echo "=== K ==="; base64 -w0 k.enc; echo
          echo "=== D ==="; base64 -w 3000 saida.enc; echo "=== FIMD ==="
          echo "=== FIM ==="
          wc -c saida.txt
