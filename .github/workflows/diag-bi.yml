name: Diag banco do BI
on:
  push:
    branches: [diag/bi-schema]
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler estrutura e amostras (saída criptografada)
        env:
          BI_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_PUBLIC_URL }}
        run: |
          test -n "$BI_DATABASE_URL" || { echo "secret BI_DATABASE_URL vazio"; exit 1; }
          cat > q.sql <<'SQL'
          \pset pager off
          \echo === INCIDENTES VO NO BOX ASA NORTE ===
          SELECT i.id, i.estado, i.inicio AT TIME ZONE 'America/Sao_Paulo' ini, i.fim AT TIME ZONE 'America/Sao_Paulo' fim, i.estado_final, i.operacao, i.canal, i.motivos::text, left(i.mensagem,120)
          FROM ifood_incidente i JOIN ifood_merchant m ON m.merchant_id=i.merchant_id
          WHERE m.nome ILIKE 'Vo no Box - Asa Norte%' ORDER BY i.inicio DESC LIMIT 8;
          \echo === HISTORICO VO NO BOX ASA NORTE (ultimas 30h) ===
          SELECT h.mudou_em AT TIME ZONE 'America/Sao_Paulo' quando, h.operacao, h.estado, h.estado_ifood, h.disponivel, h.motivos::text, left(h.mensagem,100) FROM ifood_status_historico h JOIN ifood_merchant m ON m.merchant_id=h.merchant_id
          WHERE m.nome ILIKE 'Vo no Box - Asa Norte%' AND h.mudou_em > now() - interval '30 hours' ORDER BY h.mudou_em DESC LIMIT 30;
          \echo === ENVIOS FORA DO HORARIO (2 dias) ===
          SELECT enviado_em AT TIME ZONE 'America/Sao_Paulo', grupo, left(replace(texto,E'\n',' / '),160) FROM whatsapp_envio
          WHERE corpo LIKE '%horário de funcionamento%' AND enviado_em > now() - interval '2 days' ORDER BY 1 DESC LIMIT 15;
          \echo === CONTAGEM INCIDENTES POR estado_final (7 dias) ===
          SELECT estado, estado_final, count(*) FROM ifood_incidente WHERE inicio > now() - interval '7 days' GROUP BY 1,2 ORDER BY 3 DESC;
          SQL
          docker run --rm -e BI_DATABASE_URL -v "$PWD:/w" postgres:18 \
            sh -c 'psql "$BI_DATABASE_URL" -X -f /w/q.sql > /w/saida.txt 2>&1 || true'
          openssl rand -hex 32 > k.txt
          gzip -9 -k saida.txt; openssl enc -aes-256-cbc -pbkdf2 -salt -in saida.txt.gz -out saida.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/diag/diag-pub.pem -in k.txt -out k.enc
          echo "=== K ==="; base64 -w0 k.enc; echo
          echo "=== D ==="; base64 -w 3000 saida.enc; echo "=== FIMD ==="
          echo "=== FIM ==="
          wc -c saida.txt
