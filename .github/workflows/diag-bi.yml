name: Diag banco do BI
on:
  push:
    branches: [diag/bi-schema]
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler estrutura e amostras (saída criptografada)
        env:
          BI_URL_BASE: ${{ secrets.BI_DATABASE_URL }}
        run: |
          export BI_DATABASE_URL=$(echo "$BI_URL_BASE" | sed -E 's#/[^/?]+(\?|$)#/pedidos\1#')
          test -n "$BI_DATABASE_URL" || { echo "secret BI_DATABASE_URL vazio"; exit 1; }
          cat > q.sql <<'SQL'
          \pset pager off
          \echo === ref mensal ===
          SELECT id_operacao, data_inicio, valor_bruto, valor_liquido, recebido_via_loja, repassado_plataforma, conversao, novos_clientes, tempo_entrega, tempo_aberto
          FROM silver.fato_metricas_periodo WHERE id_plataforma=1 AND periodo_tipo='MENSAL' AND id_operacao IN (1,2,3,4) AND data_inicio IN ('2026-09-01','2026-10-01') ORDER BY 1,2;
          \echo === soma semanal set ===
          SELECT id_operacao, sum(valor_bruto), sum(valor_liquido), sum(recebido_via_loja) FROM silver.fato_metricas_periodo WHERE id_plataforma=1 AND periodo_tipo='SEMANAL' AND id_operacao IN (1,2) AND data_inicio BETWEEN '2026-09-01' AND '2026-09-28' GROUP BY 1;
          SQL
          docker run --rm -e BI_DATABASE_URL -v "$PWD:/w" postgres:18 \
            sh -c 'psql "$BI_DATABASE_URL" -X -f /w/q.sql > /w/saida.txt 2>&1 || true'
          openssl rand -hex 32 > k.txt
          gzip -9 -k saida.txt; openssl enc -aes-256-cbc -pbkdf2 -salt -in saida.txt.gz -out saida.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/diag/diag-pub.pem -in k.txt -out k.enc
          echo "=== K ==="; base64 -w0 k.enc; echo
          echo "=== D ==="; base64 -w 3000 saida.enc; echo "=== FIMD ==="
          echo "=== FIM ==="
          wc -c saida.txt
