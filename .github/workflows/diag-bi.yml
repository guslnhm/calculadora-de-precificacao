name: Diag banco do BI
on:
  push:
    branches: [diag/bi-schema]
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler estrutura e amostras (saída criptografada)
        env:
          BI_URL_BASE: ${{ secrets.BI_DATABASE_URL }}
        run: |
          export BI_DATABASE_URL=$(echo "$BI_URL_BASE" | sed -E 's#/[^/?]+(\?|$)#/pedidos\1#')
          test -n "$BI_DATABASE_URL" || { echo "secret BI_DATABASE_URL vazio"; exit 1; }
          cat > q.sql <<'SQL'
          \pset pager off
          \echo === alipio 14/10 ===
          SELECT p.id_loja, p.nome_loja, p.data_hora_pedido, p.status_final_pedido st, p.valor_itens, p.taxa_entrega_cliente, p.taxa_servico,
                 p.incentivo_prom_ifood, p.incentivo_prom_loja, p.incentivo_prom_rede, p.total_pago_cliente, p.valor_liquido, p.forma_pagamento
          FROM public.pedidos p
          WHERE p.nome_loja ILIKE '%Al_pio%' AND p.data_hora_pedido >= '2026-10-14' AND p.data_hora_pedido < '2026-10-15'
          ORDER BY p.data_hora_pedido;
          \echo === colunas com entrega/frete ===
          SELECT string_agg(column_name, ', ') FROM information_schema.columns WHERE table_schema='public' AND table_name='pedidos'
            AND (column_name ILIKE '%entrega%' OR column_name ILIKE '%frete%' OR column_name ILIKE '%incentivo%' OR column_name ILIKE '%desconto%' OR column_name ILIKE '%subsid%');
          SQL
          docker run --rm -e BI_DATABASE_URL -v "$PWD:/w" postgres:18 \
            sh -c 'psql "$BI_DATABASE_URL" -X -f /w/q.sql > /w/saida.txt 2>&1 || true'
          openssl rand -hex 32 > k.txt
          gzip -9 -k saida.txt; openssl enc -aes-256-cbc -pbkdf2 -salt -in saida.txt.gz -out saida.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/diag/diag-pub.pem -in k.txt -out k.enc
          echo "=== K ==="; base64 -w0 k.enc; echo
          echo "=== D ==="; base64 -w 3000 saida.enc; echo "=== FIMD ==="
          echo "=== FIM ==="
          wc -c saida.txt
