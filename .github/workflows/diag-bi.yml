name: Diag banco do BI
on:
  push:
    branches: [diag/bi-schema]
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler estrutura e amostras (saída criptografada)
        env:
          BI_URL_BASE: ${{ secrets.BI_DATABASE_URL }}
        run: |
          export BI_DATABASE_URL=$(echo "$BI_URL_BASE" | sed -E 's#/[^/?]+(\?|$)#/pedidos\1#')
          test -n "$BI_DATABASE_URL" || { echo "secret BI_DATABASE_URL vazio"; exit 1; }
          cat > q.sql <<'SQL'
          \pset pager off
          \echo === status distintos (out-nov) ===
          SELECT status_final_pedido, count(*), count(*) FILTER (WHERE valor_liquido > 0) liq_pos FROM public.pedidos WHERE data_hora_pedido >= '2026-10-01' GROUP BY 1 ORDER BY 2 DESC;
          \echo === aguas claras norte 21/10 nao concluidos ===
          SELECT id_loja, nome_loja, id_curto, data_hora_pedido, status_final_pedido st, valor_itens, taxa_entrega_cliente, valor_itens_cancelados canc, valor_liquido, total_pago_cliente, tipo_cancelamento, origem_cancelamento, motivo_cancelamento
          FROM public.pedidos WHERE nome_loja ILIKE '%guas Claras Norte%' AND data_hora_pedido >= '2026-10-21' AND data_hora_pedido < '2026-10-22' AND status_final_pedido <> 'CONCLUIDO';
          \echo === aguas claras norte 21/10 totais ===
          SELECT status_final_pedido, count(*), sum(valor_itens), sum(taxa_entrega_cliente), sum(valor_liquido) FROM public.pedidos WHERE nome_loja ILIKE '%guas Claras Norte%' AND data_hora_pedido >= '2026-10-21' AND data_hora_pedido < '2026-10-22' GROUP BY 1;
          \echo === cancelados com liquido > 0 por tipo (out-nov) ===
          SELECT tipo_cancelamento, origem_cancelamento, count(*), sum(valor_itens), sum(valor_liquido) FROM public.pedidos WHERE data_hora_pedido >= '2026-10-01' AND status_final_pedido = 'CANCELADO' AND valor_liquido > 0 GROUP BY 1,2 ORDER BY 3 DESC LIMIT 10;
          SQL
          docker run --rm -e BI_DATABASE_URL -v "$PWD:/w" postgres:18 \
            sh -c 'psql "$BI_DATABASE_URL" -X -f /w/q.sql > /w/saida.txt 2>&1 || true'
          openssl rand -hex 32 > k.txt
          gzip -9 -k saida.txt; openssl enc -aes-256-cbc -pbkdf2 -salt -in saida.txt.gz -out saida.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/diag/diag-pub.pem -in k.txt -out k.enc
          echo "=== K ==="; base64 -w0 k.enc; echo
          echo "=== D ==="; base64 -w 3000 saida.enc; echo "=== FIMD ==="
          echo "=== FIM ==="
          wc -c saida.txt
