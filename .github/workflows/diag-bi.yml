name: Diag banco do BI
on:
  push:
    branches: [diag/bi-schema]
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler estrutura e amostras (saída criptografada)
        env:
          BI_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_PUBLIC_URL }}
        run: |
          test -n "$BI_DATABASE_URL" || { echo "secret BI_DATABASE_URL vazio"; exit 1; }
          cat > q.sql <<'SQL'
          \pset pager off
          \echo === SEM AUTORIZACAO (403) ===
          SELECT m.nome, c.erro_em AT TIME ZONE 'America/Sao_Paulo' quando FROM painel_coleta c JOIN ifood_merchant m ON m.merchant_id=c.merchant_id
           WHERE m.ativo AND c.ultimo_erro ILIKE '%autorizou%' AND (c.ultima_coleta IS NULL OR c.ultima_coleta < c.erro_em) ORDER BY 1;
          \echo === OUTROS ERROS ===
          SELECT m.nome, left(c.ultimo_erro,120), c.erro_em AT TIME ZONE 'America/Sao_Paulo' FROM painel_coleta c JOIN ifood_merchant m ON m.merchant_id=c.merchant_id
           WHERE m.ativo AND c.ultimo_erro IS NOT NULL AND c.ultimo_erro NOT ILIKE '%autorizou%' AND (c.ultima_coleta IS NULL OR c.ultima_coleta < c.erro_em) ORDER BY 1;
          \echo === TOTAIS ===
          SELECT count(*) FILTER (WHERE m.ativo) ativas, count(*) FILTER (WHERE m.ativo AND c.ultima_coleta >= now() - interval '2 days') coletando FROM ifood_merchant m LEFT JOIN painel_coleta c ON c.merchant_id=m.merchant_id;
          \echo === COLUNAS COLETA ===
          SELECT column_name FROM information_schema.columns WHERE table_name='painel_coleta';
          \echo === LANCAMENTOS MANUAIS ===
          SELECT count(*), max(atualizado_em) FROM painel_manual;
          SQL
          docker run --rm -e BI_DATABASE_URL -v "$PWD:/w" postgres:18 \
            sh -c 'psql "$BI_DATABASE_URL" -X -f /w/q.sql > /w/saida.txt 2>&1 || true'
          openssl rand -hex 32 > k.txt
          gzip -9 -k saida.txt; openssl enc -aes-256-cbc -pbkdf2 -salt -in saida.txt.gz -out saida.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/diag/diag-pub.pem -in k.txt -out k.enc
          echo "=== K ==="; base64 -w0 k.enc; echo
          echo "=== D ==="; base64 -w 3000 saida.enc; echo "=== FIMD ==="
          echo "=== FIM ==="
          wc -c saida.txt
