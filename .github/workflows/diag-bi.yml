name: Diag banco do BI
on:
  push:
    branches: [diag/bi-schema]
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler estrutura e amostras (saída criptografada)
        env:
          BI_DATABASE_URL: ${{ secrets.BI_DATABASE_URL }}
        run: |
          test -n "$BI_DATABASE_URL" || { echo "secret BI_DATABASE_URL vazio"; exit 1; }
          cat > q.sql <<'SQL'
          \pset pager off
          \echo === ALIAS COLUNAS ===
          SELECT column_name, data_type FROM information_schema.columns WHERE table_schema='silver' AND table_name IN ('dim_operacao_alias','dim_operacao') ORDER BY table_name, ordinal_position;
          \echo === ALIAS AMOSTRA ===
          SELECT * FROM silver.dim_operacao_alias ORDER BY id_operacao LIMIT 25;
          \echo === ALIAS CONTAGEM ===
          SELECT id_plataforma, count(*), count(DISTINCT id_operacao), count(id_loja_origem) FROM silver.dim_operacao_alias GROUP BY 1;
          \echo === DATAS ===
          SELECT periodo_tipo, extract(isodow FROM data_inicio) dow, count(*), min(data_inicio), max(data_inicio), max(data_fim) FROM gold.financeiro_periodo GROUP BY 1,2 ORDER BY 1,2;
          SELECT data_inicio, data_fim, count(*) FROM gold.financeiro_periodo WHERE periodo_tipo='SEMANAL' GROUP BY 1,2 ORDER BY 1 DESC LIMIT 6;
          \echo === CONFIG MERCHANTS ===
          SELECT column_name FROM information_schema.columns WHERE table_schema='config' AND table_name='ifood_merchants';
          SELECT * FROM config.ifood_merchants LIMIT 5;
          SQL
          export BI_DATABASE_URL="$(printf '%s' "$BI_DATABASE_URL" | sed -E 's#/railway(\?|$)#/pedidos\1#')"
          docker run --rm -e BI_DATABASE_URL -v "$PWD:/w" postgres:18 \
            sh -c 'psql "$BI_DATABASE_URL" -X -f /w/q.sql > /w/saida.txt 2>&1 || true'
          openssl rand -hex 32 > k.txt
          gzip -9 -k saida.txt; openssl enc -aes-256-cbc -pbkdf2 -salt -in saida.txt.gz -out saida.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/diag/diag-pub.pem -in k.txt -out k.enc
          echo "=== K ==="; base64 -w0 k.enc; echo
          echo "=== D ==="; base64 -w 3000 saida.enc; echo "=== FIMD ==="
          echo "=== FIM ==="
          wc -c saida.txt
