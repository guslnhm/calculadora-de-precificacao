name: Diag banco do BI
on:
  push:
    branches: [diag/bi-schema]
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler estrutura e amostras (saída criptografada)
        env:
          BI_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_PUBLIC_URL }}
        run: |
          test -n "$BI_DATABASE_URL" || { echo "secret BI_DATABASE_URL vazio"; exit 1; }
          cat > q.sql <<'SQL'
          \pset pager off
          \echo === DIA 18/11 ===
          SELECT count(*) linhas, count(*) FILTER (WHERE pedidos=0) zeradas, min(coletado_em) AT TIME ZONE 'America/Sao_Paulo', max(coletado_em) AT TIME ZONE 'America/Sao_Paulo', sum(pedidos) FROM painel_dia WHERE dia='2026-11-18';
          SELECT d.dia, m.nome, d.pedidos, d.gmv, d.coletado_em AT TIME ZONE 'America/Sao_Paulo' coletado FROM painel_dia d JOIN ifood_merchant m ON m.merchant_id=d.merchant_id
           WHERE d.dia >= '2026-11-16' AND (m.nome ILIKE 'Chicken Lovers -  Lozandes%' OR m.nome ILIKE 'Lux Hamb%' OR m.nome ILIKE 'Qg - Bougainville%') ORDER BY m.nome, d.dia;
          \echo === ZERADAS 18/11 (lojas) ===
          SELECT m.nome, d.coletado_em AT TIME ZONE 'America/Sao_Paulo' FROM painel_dia d JOIN ifood_merchant m ON m.merchant_id=d.merchant_id WHERE d.dia='2026-11-18' AND d.pedidos=0 ORDER BY 2, 1;
          \echo === COLETA HOJE ===
          SELECT min(ultima_coleta) AT TIME ZONE 'America/Sao_Paulo', max(ultima_coleta) AT TIME ZONE 'America/Sao_Paulo', count(*) FILTER (WHERE ultima_coleta > current_date) FROM painel_coleta;
          \echo === RESUMO ENVIADO ===
          SELECT min(enviado_em) AT TIME ZONE 'America/Sao_Paulo', max(enviado_em) AT TIME ZONE 'America/Sao_Paulo', count(*) FROM whatsapp_envio WHERE tipo='resumo' AND enviado_em > current_date;
          SQL
          docker run --rm -e BI_DATABASE_URL -v "$PWD:/w" postgres:18 \
            sh -c 'psql "$BI_DATABASE_URL" -X -f /w/q.sql > /w/saida.txt 2>&1 || true'
          openssl rand -hex 32 > k.txt
          gzip -9 -k saida.txt; openssl enc -aes-256-cbc -pbkdf2 -salt -in saida.txt.gz -out saida.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/diag/diag-pub.pem -in k.txt -out k.enc
          echo "=== K ==="; base64 -w0 k.enc; echo
          echo "=== D ==="; base64 -w 3000 saida.enc; echo "=== FIMD ==="
          echo "=== FIM ==="
          wc -c saida.txt
