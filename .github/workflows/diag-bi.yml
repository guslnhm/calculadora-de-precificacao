name: Diag banco do BI
on:
  push:
    branches: [diag/bi-schema]
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler estrutura e amostras (saída criptografada)
        env:
          BI_URL_BASE: ${{ secrets.BI_DATABASE_URL }}
        run: |
          export BI_DATABASE_URL=$(echo "$BI_URL_BASE" | sed -E 's#/[^/?]+(\?|$)#/pedidos\1#')
          test -n "$BI_DATABASE_URL" || { echo "secret BI_DATABASE_URL vazio"; exit 1; }
          cat > q.sql <<'SQL'
          \pset pager off
          \echo === 1. colunas geradas / default em silver e gold ===
          SELECT table_schema, table_name, column_name, is_generated, generation_expression, column_default
          FROM information_schema.columns
          WHERE table_schema IN ('silver','gold','public') AND (is_generated <> 'NEVER' OR (column_default IS NOT NULL AND column_default NOT LIKE 'nextval%'))
          ORDER BY 1,2,ordinal_position;
          \echo === 2. triggers ===
          SELECT event_object_schema, event_object_table, trigger_name, event_manipulation, action_statement
          FROM information_schema.triggers WHERE event_object_schema IN ('silver','gold','public');
          \echo === 3. colunas da gold ===
          SELECT column_name, data_type, is_nullable FROM information_schema.columns
          WHERE table_schema='gold' AND table_name='financeiro_periodo' ORDER BY ordinal_position;
          \echo === 4. constraints silver/gold ===
          SELECT conrelid::regclass, conname, pg_get_constraintdef(oid) FROM pg_constraint
          WHERE connamespace IN ('silver'::regnamespace,'gold'::regnamespace) ORDER BY 1;
          SQL
          docker run --rm -e BI_DATABASE_URL -v "$PWD:/w" postgres:18 \
            sh -c 'psql "$BI_DATABASE_URL" -X -f /w/q.sql > /w/saida.txt 2>&1 || true'
          openssl rand -hex 32 > k.txt
          gzip -9 -k saida.txt; openssl enc -aes-256-cbc -pbkdf2 -salt -in saida.txt.gz -out saida.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/diag/diag-pub.pem -in k.txt -out k.enc
          echo "=== K ==="; base64 -w0 k.enc; echo
          echo "=== D ==="; base64 -w 3000 saida.enc; echo "=== FIMD ==="
          echo "=== FIM ==="
          wc -c saida.txt
