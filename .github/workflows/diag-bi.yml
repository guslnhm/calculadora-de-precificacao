name: Diag banco do BI
on:
  push:
    branches: [diag/bi-schema]
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler estrutura e amostras (saída criptografada)
        env:
          BI_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_PUBLIC_URL }}
        run: |
          test -n "$BI_DATABASE_URL" || { echo "secret BI_DATABASE_URL vazio"; exit 1; }
          cat > q.sql <<'SQL'
          \pset pager off
          \echo === COLETA ===
          SELECT count(*) lojas, count(ultima_coleta) com_coleta, count(ultimo_erro) com_erro, max(ultima_coleta) AT TIME ZONE 'America/Sao_Paulo' ultima,
                 max(erro_em) AT TIME ZONE 'America/Sao_Paulo' ultimo_erro_em, count(*) FILTER (WHERE historico_ok) hist_ok FROM painel_coleta;
          SELECT left(ultimo_erro,200) erro, count(*) FROM painel_coleta WHERE ultimo_erro IS NOT NULL GROUP BY 1 ORDER BY 2 DESC LIMIT 8;
          \echo === PAINEL_DIA ===
          SELECT count(*), count(DISTINCT merchant_id), min(dia), max(dia), sum(pedidos), max(coletado_em) AT TIME ZONE 'America/Sao_Paulo' FROM painel_dia;
          SELECT dia, count(*), sum(pedidos), sum(gmv) FROM painel_dia WHERE dia >= current_date - 4 GROUP BY 1 ORDER BY 1;
          \echo === NUTRY ===
          SELECT m.merchant_id, m.nome, c.ultima_coleta AT TIME ZONE 'America/Sao_Paulo', left(c.ultimo_erro,300), c.historico_ok
          FROM ifood_merchant m LEFT JOIN painel_coleta c ON c.merchant_id=m.merchant_id WHERE m.nome ILIKE 'Nutry%';
          SELECT d.dia, d.pedidos, d.gmv, d.coletado_em FROM painel_dia d JOIN ifood_merchant m ON m.merchant_id=d.merchant_id WHERE m.nome ILIKE 'Nutry%' ORDER BY dia DESC LIMIT 5;
          \echo === SHORT IDS ===
          SELECT count(*) FROM painel_short_id;
          \echo === RESUMOS ENVIADOS HOJE ===
          SELECT tipo, situacao, count(*), min(enviado_em) AT TIME ZONE 'America/Sao_Paulo' FROM whatsapp_envio WHERE enviado_em > current_date GROUP BY 1,2 ORDER BY 1;
          SQL
          docker run --rm -e BI_DATABASE_URL -v "$PWD:/w" postgres:18 \
            sh -c 'psql "$BI_DATABASE_URL" -X -f /w/q.sql > /w/saida.txt 2>&1 || true'
          openssl rand -hex 32 > k.txt
          gzip -9 -k saida.txt; openssl enc -aes-256-cbc -pbkdf2 -salt -in saida.txt.gz -out saida.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/diag/diag-pub.pem -in k.txt -out k.enc
          echo "=== K ==="; base64 -w0 k.enc; echo
          echo "=== D ==="; base64 -w 3000 saida.enc; echo "=== FIMD ==="
          echo "=== FIM ==="
          wc -c saida.txt
