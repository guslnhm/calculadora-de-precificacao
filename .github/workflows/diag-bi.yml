name: Diag banco do BI
on:
  push:
    branches: [diag/bi-schema]
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler estrutura e amostras (saída criptografada)
        env:
          BI_URL_BASE: ${{ secrets.BI_DATABASE_URL }}
        run: |
          export BI_DATABASE_URL=$(echo "$BI_URL_BASE" | sed -E 's#/[^/?]+(\?|$)#/pedidos\1#')
          test -n "$BI_DATABASE_URL" || { echo "secret BI_DATABASE_URL vazio"; exit 1; }
          cat > q.sql <<'SQL'
          \pset pager off
          \echo === cobertura por dia ===
          SELECT data_hora_pedido::date dia, count(*) FILTER (WHERE status_final_pedido<>'CANCELADO') ped, count(*) FILTER (WHERE status_final_pedido<>'CANCELADO' AND valor_liquido IS NULL) sem FROM public.pedidos WHERE data_hora_pedido >= '2026-11-20' GROUP BY 1 ORDER BY 1;
          \echo === sem liquido 25 por hora ===
          SELECT extract(hour from data_hora_pedido) h, count(*) FILTER (WHERE status_final_pedido<>'CANCELADO') ped, count(*) FILTER (WHERE status_final_pedido<>'CANCELADO' AND valor_liquido IS NULL) sem FROM public.pedidos WHERE data_hora_pedido >= '2026-11-25' AND data_hora_pedido < '2026-11-26' GROUP BY 1 ORDER BY 1;
          \echo === sem liquido 25 por pagamento e status ===
          SELECT coalesce(forma_pagamento,'?') fp, status_final_pedido st, count(*) n, count(*) FILTER (WHERE valor_liquido IS NULL) sem FROM public.pedidos WHERE data_hora_pedido >= '2026-11-25' AND data_hora_pedido < '2026-11-26' GROUP BY 1,2 ORDER BY 3 DESC LIMIT 15;
          SQL
          docker run --rm -e BI_DATABASE_URL -v "$PWD:/w" postgres:18 \
            sh -c 'psql "$BI_DATABASE_URL" -X -f /w/q.sql > /w/saida.txt 2>&1 || true'
          openssl rand -hex 32 > k.txt
          gzip -9 -k saida.txt; openssl enc -aes-256-cbc -pbkdf2 -salt -in saida.txt.gz -out saida.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/diag/diag-pub.pem -in k.txt -out k.enc
          echo "=== K ==="; base64 -w0 k.enc; echo
          echo "=== D ==="; base64 -w 3000 saida.enc; echo "=== FIMD ==="
          echo "=== FIM ==="
          wc -c saida.txt
