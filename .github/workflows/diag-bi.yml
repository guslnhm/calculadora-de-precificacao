name: Diag banco do BI
on:
  push:
    branches: [diag/bi-schema]
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler estrutura e amostras (saída criptografada)
        env:
          BI_URL_BASE: ${{ secrets.BI_DATABASE_URL }}
        run: |
          export BI_DATABASE_URL=$(echo "$BI_URL_BASE" | sed -E 's#/[^/?]+(\?|$)#/pedidos\1#')
          test -n "$BI_DATABASE_URL" || { echo "secret BI_DATABASE_URL vazio"; exit 1; }
          cat > q.sql <<'SQL'
          \pset pager off
          \echo === fato por semana ===
          SELECT date_trunc('week', data_hora_pedido)::date sem, count(*), count(DISTINCT id_operacao) ops FROM silver.fato_pedido WHERE data_hora_pedido >= '2026-10-12' GROUP BY 1 ORDER BY 1;
          \echo === pedidos por semana ===
          SELECT date_trunc('week', data_hora_pedido)::date sem, count(*), min(data_hora_pedido), max(data_hora_pedido) FROM public.pedidos WHERE data_hora_pedido >= '2026-10-12' GROUP BY 1 ORDER BY 1;
          \echo === gold por semana ===
          SELECT periodo_tipo, data_inicio, count(*), sum(qtd_pedidos), count(valor_bruto) FROM gold.financeiro_periodo WHERE data_inicio >= '2026-10-01' GROUP BY 1,2 ORDER BY 1,2;
          \echo === metricas por semana ===
          SELECT periodo_tipo, data_inicio, count(*), count(valor_bruto), max(data_carga) FROM silver.fato_metricas_periodo WHERE data_inicio >= '2026-10-01' GROUP BY 1,2 ORDER BY 1,2;
          SQL
          docker run --rm -e BI_DATABASE_URL -v "$PWD:/w" postgres:18 \
            sh -c 'psql "$BI_DATABASE_URL" -X -f /w/q.sql > /w/saida.txt 2>&1 || true'
          openssl rand -hex 32 > k.txt
          gzip -9 -k saida.txt; openssl enc -aes-256-cbc -pbkdf2 -salt -in saida.txt.gz -out saida.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/diag/diag-pub.pem -in k.txt -out k.enc
          echo "=== K ==="; base64 -w0 k.enc; echo
          echo "=== D ==="; base64 -w 3000 saida.enc; echo "=== FIMD ==="
          echo "=== FIM ==="
          wc -c saida.txt
