name: Diag banco do BI
on:
  push:
    branches: [diag/bi-schema]
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler estrutura e amostras (saída criptografada)
        env:
          BI_DATABASE_URL: ${{ secrets.BI_DATABASE_URL }}
        run: |
          test -n "$BI_DATABASE_URL" || { echo "secret BI_DATABASE_URL vazio"; exit 1; }
          cat > q.sql <<'SQL'
          \pset pager off
          \echo === TIPOS ===
          SELECT column_name, data_type, numeric_precision, numeric_scale FROM information_schema.columns
           WHERE table_schema='gold' AND table_name='financeiro_periodo' ORDER BY ordinal_position;
          \echo === EXTREMOS ===
          SELECT count(*) total, count(*) FILTER (WHERE periodo_tipo IS NULL) sem_tipo,
                 count(*) FILTER (WHERE data_inicio IS NULL) sem_inicio,
                 max(abs(valor_itens)) itens, max(abs(ticket_medio)) ticket, max(abs(repasse)) repasse,
                 max(abs(taxa_repasse)) taxa_rep, max(abs(conversao)) conv, max(abs(tempo_entrega)) tempo_ent,
                 max(abs(tempo_aberto)) tempo_ab, max(qtd_pedidos) ped, max(novos_clientes) novos,
                 max(abs(incentivos_ifood)) inc_if, max(abs(incentivos_loja)) inc_lj, max(abs(valor_bruto)) bruto,
                 max(abs(valor_liquido)) liq, max(qtd_cancelamentos) canc
          FROM gold.financeiro_periodo;
          \echo === TIPOS DE PERIODO E PLATAFORMAS ===
          SELECT periodo_tipo, id_plataforma, count(*) FROM gold.financeiro_periodo GROUP BY 1,2 ORDER BY 1,2;
          SELECT * FROM silver.dim_plataforma;
          \echo === DUPLICADOS id_financeiro ===
          SELECT count(*) - count(DISTINCT id_financeiro) FROM gold.financeiro_periodo;
          SQL
          export BI_DATABASE_URL="$(printf '%s' "$BI_DATABASE_URL" | sed -E 's#/railway(\?|$)#/pedidos\1#')"
          docker run --rm -e BI_DATABASE_URL -v "$PWD:/w" postgres:18 \
            sh -c 'psql "$BI_DATABASE_URL" -X -f /w/q.sql > /w/saida.txt 2>&1 || true'
          openssl rand -hex 32 > k.txt
          gzip -9 -k saida.txt; openssl enc -aes-256-cbc -pbkdf2 -salt -in saida.txt.gz -out saida.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/diag/diag-pub.pem -in k.txt -out k.enc
          echo "=== K ==="; base64 -w0 k.enc; echo
          echo "=== D ==="; base64 -w 3000 saida.enc; echo "=== FIMD ==="
          echo "=== FIM ==="
          wc -c saida.txt
