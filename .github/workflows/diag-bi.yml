name: Diag banco do BI
on:
  push:
    branches: [diag/bi-schema]
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler estrutura e amostras (saída criptografada)
        env:
          BI_URL_BASE: ${{ secrets.BI_DATABASE_URL }}
        run: |
          export BI_DATABASE_URL=$(echo "$BI_URL_BASE" | sed -E 's#/[^/?]+(\?|$)#/pedidos\1#')
          test -n "$BI_DATABASE_URL" || { echo "secret BI_DATABASE_URL vazio"; exit 1; }
          cat > q.sql <<'SQL'
          \pset pager off
          \echo === semana 16 a 22/11 por loja ===
          SELECT p.id_loja, count(*) ped,
                 sum(valor_itens) itens, sum(taxa_entrega_cliente) taxa, sum(nullif(replace(taxa_servico::text, ',', '.'),'')::numeric) serv,
                 sum(nullif(replace(incentivo_prom_ifood::text, ',', '.'),'')::numeric) inc_ifood, sum(nullif(replace(incentivo_prom_loja::text, ',', '.'),'')::numeric) inc_loja, sum(nullif(replace(incentivo_prom_rede::text, ',', '.'),'')::numeric) inc_rede,
                 sum(total_pago_cliente) pago, sum(nullif(replace(valor_itens_cancelados::text, ',', '.'),'')::numeric) itens_canc
          FROM public.pedidos p
          WHERE p.id_loja IN ('1109497','1945022','269080','702315') AND p.status_final_pedido <> 'CANCELADO'
            AND p.data_hora_pedido >= '2026-11-16' AND p.data_hora_pedido < '2026-11-23'
          GROUP BY 1 ORDER BY 1;
          SQL
          docker run --rm -e BI_DATABASE_URL -v "$PWD:/w" postgres:18 \
            sh -c 'psql "$BI_DATABASE_URL" -X -f /w/q.sql > /w/saida.txt 2>&1 || true'
          openssl rand -hex 32 > k.txt
          gzip -9 -k saida.txt; openssl enc -aes-256-cbc -pbkdf2 -salt -in saida.txt.gz -out saida.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/diag/diag-pub.pem -in k.txt -out k.enc
          echo "=== K ==="; base64 -w0 k.enc; echo
          echo "=== D ==="; base64 -w 3000 saida.enc; echo "=== FIMD ==="
          echo "=== FIM ==="
          wc -c saida.txt
