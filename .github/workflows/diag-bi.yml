name: Diag banco do BI
on:
  push:
    branches: [diag/bi-schema]
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler estrutura e amostras (saída criptografada)
        env:
          BI_URL_BASE: ${{ secrets.BI_DATABASE_URL }}
        run: |
          export BI_DATABASE_URL=$(echo "$BI_URL_BASE" | sed -E 's#/[^/?]+(\?|$)#/pedidos\1#')
          test -n "$BI_DATABASE_URL" || { echo "secret BI_DATABASE_URL vazio"; exit 1; }
          cat > q.sql <<'SQL'
          \pset pager off
          \echo === silver por dia ===
          SELECT data_hora_pedido::date dia, count(*) FROM silver.fato_pedido WHERE id_plataforma=1 AND data_hora_pedido >= '2026-11-23' GROUP BY 1 ORDER BY 1;
          \echo === mais perto do recorde em 26/11 ===
          WITH d AS (SELECT f.id_operacao, f.data_hora_pedido::date dia, count(*) ped, sum(f.valor_itens) fat
                     FROM silver.fato_pedido f WHERE f.id_plataforma = 1 AND f.status_final_pedido <> 'CANCELADO' AND f.data_hora_pedido < '2026-11-27' GROUP BY 1,2),
          alt AS (SELECT id_operacao, max(data_inicio) ini FROM gold.financeiro_periodo WHERE id_plataforma=1 AND periodo_tipo='SEMANAL' AND alteracao_cardapio AND data_inicio <= '2026-11-26' GROUP BY 1),
          h AS (SELECT * FROM d WHERE dia = '2026-11-26'),
          x AS (
          SELECT h.id_operacao, h.ped, h.fat, round(h.fat/h.ped,2) tk, alt.ini,
                 (SELECT count(*) FROM d WHERE d.id_operacao=h.id_operacao AND d.dia<h.dia) dias_hist,
                 (SELECT max(fat) FROM d WHERE d.id_operacao=h.id_operacao AND d.dia<h.dia) max_fat,
                 (SELECT max(ped) FROM d WHERE d.id_operacao=h.id_operacao AND d.dia<h.dia) max_ped,
                 (SELECT max(fat) FROM d WHERE d.id_operacao=h.id_operacao AND d.dia<h.dia AND d.dia >= coalesce(alt.ini, h.dia-90)) jan_fat,
                 (SELECT max(ped) FROM d WHERE d.id_operacao=h.id_operacao AND d.dia<h.dia AND d.dia >= coalesce(alt.ini, h.dia-90)) jan_ped,
                 (SELECT count(*) FROM d WHERE d.id_operacao=h.id_operacao AND d.dia<h.dia AND d.dia >= coalesce(alt.ini, h.dia-90)) dias_jan
          FROM h LEFT JOIN alt ON alt.id_operacao=h.id_operacao)
          SELECT id_operacao, ped, max_ped, jan_ped, round(fat) fat, round(max_fat) max_fat, round(jan_fat) jan_fat, dias_hist, dias_jan, ini,
                 round(fat/nullif(jan_fat,0)*100) pct_jan_fat
          FROM x ORDER BY fat/nullif(jan_fat,0) DESC NULLS LAST LIMIT 12;
          SQL
          docker run --rm -e BI_DATABASE_URL -v "$PWD:/w" postgres:18 \
            sh -c 'psql "$BI_DATABASE_URL" -X -f /w/q.sql > /w/saida.txt 2>&1 || true'
          openssl rand -hex 32 > k.txt
          gzip -9 -k saida.txt; openssl enc -aes-256-cbc -pbkdf2 -salt -in saida.txt.gz -out saida.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/diag/diag-pub.pem -in k.txt -out k.enc
          echo "=== K ==="; base64 -w0 k.enc; echo
          echo "=== D ==="; base64 -w 3000 saida.enc; echo "=== FIMD ==="
          echo "=== FIM ==="
          wc -c saida.txt
