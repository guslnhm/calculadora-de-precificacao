name: Diag banco do BI
on:
  push:
    branches: [diag/bi-schema]
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler estrutura e amostras (saída criptografada)
        env:
          BI_URL_BASE: ${{ secrets.BI_DATABASE_URL }}
        run: |
          export BI_DATABASE_URL=$(echo "$BI_URL_BASE" | sed -E 's#/[^/?]+(\?|$)#/pedidos\1#')
          test -n "$BI_DATABASE_URL" || { echo "secret BI_DATABASE_URL vazio"; exit 1; }
          cat > q.sql <<'SQL'
          \pset pager off
          \echo === TIPOS FATO/GOLD/METRICAS ===
          SELECT table_schema, table_name, column_name, data_type, numeric_precision, numeric_scale, column_default, is_nullable FROM information_schema.columns
           WHERE (table_schema='silver' AND table_name IN ('fato_pedido','fato_metricas_periodo','dim_operacao','dim_loja','dim_operacao_alias')) OR (table_schema='gold' AND table_name='financeiro_periodo') ORDER BY 1,2,ordinal_position;
          \echo === COBERTURA OUT/26: pedidos com alias x fato ===
          SELECT p.canal_venda, count(*) pedidos, count(f.id_pedido) no_fato
          FROM public.pedidos p JOIN silver.dim_operacao_alias a ON a.id_loja_origem=p.id_loja AND a.id_plataforma=1
          LEFT JOIN silver.fato_pedido f ON f.id_pedido = p.id_completo_pedido
          WHERE p.data_hora_pedido >= '2026-10-01' AND p.data_hora_pedido < '2026-11-01' GROUP BY 1;
          \echo === fato id_operacao == alias? (amostra divergencias) ===
          SELECT count(*) FILTER (WHERE f.id_operacao = a.id_operacao) iguais, count(*) FILTER (WHERE f.id_operacao <> a.id_operacao) dif
          FROM silver.fato_pedido f JOIN public.pedidos p ON p.id_completo_pedido=f.id_pedido JOIN silver.dim_operacao_alias a ON a.id_loja_origem=p.id_loja AND a.id_plataforma=1
          WHERE f.data_hora_pedido >= '2026-10-01';
          \echo === alias duplicado por id_loja ===
          SELECT id_loja_origem, count(*) FROM silver.dim_operacao_alias WHERE id_plataforma=1 GROUP BY 1 HAVING count(*)>1;
          \echo === dim_operacao amostra ===
          SELECT * FROM silver.dim_operacao ORDER BY id_operacao DESC LIMIT 5;
          SELECT * FROM silver.dim_loja ORDER BY id_loja DESC LIMIT 5;
          SELECT * FROM silver.dim_tipo_entrega;
          \echo === seq ===
          SELECT sequence_schema, sequence_name FROM information_schema.sequences;
          \echo === permissoes do usuario ===
          SELECT current_user, rolsuper FROM pg_roles WHERE rolname=current_user;
          SQL
          docker run --rm -e BI_DATABASE_URL -v "$PWD:/w" postgres:18 \
            sh -c 'psql "$BI_DATABASE_URL" -X -f /w/q.sql > /w/saida.txt 2>&1 || true'
          openssl rand -hex 32 > k.txt
          gzip -9 -k saida.txt; openssl enc -aes-256-cbc -pbkdf2 -salt -in saida.txt.gz -out saida.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/diag/diag-pub.pem -in k.txt -out k.enc
          echo "=== K ==="; base64 -w0 k.enc; echo
          echo "=== D ==="; base64 -w 3000 saida.enc; echo "=== FIMD ==="
          echo "=== FIM ==="
          wc -c saida.txt
