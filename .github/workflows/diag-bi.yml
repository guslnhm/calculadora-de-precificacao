name: Diag banco do BI
on:
  push:
    branches: [diag/bi-schema]
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler estrutura e amostras (saída criptografada)
        env:
          BI_URL_BASE: ${{ secrets.BI_DATABASE_URL }}
        run: |
          export BI_DATABASE_URL=$(echo "$BI_URL_BASE" | sed -E 's#/[^/?]+(\?|$)#/pedidos\1#')
          test -n "$BI_DATABASE_URL" || { echo "secret BI_DATABASE_URL vazio"; exit 1; }
          cat > q.sql <<'SQL'
          \pset pager off
          \echo === lacunas antigas ===
          SELECT g.periodo_tipo, g.data_inicio, g.data_fim, g.id_operacao, l.nome_loja || ' - ' || o.nome_operacao nome,
                 (SELECT string_agg(a.id_loja_origem, ',') FROM silver.dim_operacao_alias a WHERE a.id_operacao = g.id_operacao AND a.id_plataforma = 1) ids,
                 g.qtd_pedidos, (g.valor_bruto IS NULL) sb, (g.conversao IS NULL) sc, (g.novos_clientes IS NULL) sn, (g.tempo_entrega IS NULL) st, (g.tempo_aberto IS NULL) sa
          FROM gold.financeiro_periodo g JOIN silver.dim_operacao o ON o.id_operacao = g.id_operacao JOIN silver.dim_loja l ON l.id_loja = o.id_loja
          WHERE g.id_plataforma = 1 AND g.qtd_pedidos > 0
            AND ((g.periodo_tipo = 'SEMANAL' AND g.data_inicio BETWEEN '2026-08-24' AND '2026-10-19') OR (g.periodo_tipo = 'MENSAL' AND g.data_inicio BETWEEN '2026-08-01' AND '2026-10-01'))
            AND (g.valor_bruto IS NULL OR g.conversao IS NULL OR g.novos_clientes IS NULL OR g.tempo_aberto IS NULL)
          ORDER BY 1, 4, 2;
          SQL
          docker run --rm -e BI_DATABASE_URL -v "$PWD:/w" postgres:18 \
            sh -c 'psql "$BI_DATABASE_URL" -X -f /w/q.sql > /w/saida.txt 2>&1 || true'
          openssl rand -hex 32 > k.txt
          gzip -9 -k saida.txt; openssl enc -aes-256-cbc -pbkdf2 -salt -in saida.txt.gz -out saida.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/diag/diag-pub.pem -in k.txt -out k.enc
          echo "=== K ==="; base64 -w0 k.enc; echo
          echo "=== D ==="; base64 -w 3000 saida.enc; echo "=== FIMD ==="
          echo "=== FIM ==="
          wc -c saida.txt
