name: Diag banco do BI
on:
  push:
    branches: [diag/bi-schema]
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler estrutura e amostras (saída criptografada)
        env:
          BI_URL_BASE: ${{ secrets.BI_DATABASE_URL }}
        run: |
          export BI_DATABASE_URL=$(echo "$BI_URL_BASE" | sed -E 's#/[^/?]+(\?|$)#/pedidos\1#')
          test -n "$BI_DATABASE_URL" || { echo "secret BI_DATABASE_URL vazio"; exit 1; }
          cat > q.sql <<'SQL'
          \pset pager off
          \echo === 25/11 liq zerado ===
          SELECT p.data_hora_pedido::date dia, p.status_final_pedido, count(*), count(*) FILTER (WHERE p.valor_liquido IS NULL) liq_nulo, count(*) FILTER (WHERE p.valor_liquido = 0) liq_zero,
                 count(*) FILTER (WHERE p.taxas_comissoes = 0 OR p.taxas_comissoes IS NULL) sem_taxa
          FROM public.pedidos p WHERE p.data_hora_pedido >= '2026-11-23' GROUP BY 1,2 ORDER BY 1,2;
          \echo === op 1 dia 25 por hora ===
          SELECT extract(hour from data_hora_pedido) h, count(*), sum(valor_itens), sum(valor_liquido), sum(taxas_comissoes) FROM public.pedidos p JOIN silver.dim_operacao_alias a ON a.id_loja_origem = p.id_loja WHERE a.id_operacao = 1 AND p.data_hora_pedido::date = '2026-11-25' GROUP BY 1 ORDER BY 1;
          SQL
          docker run --rm -e BI_DATABASE_URL -v "$PWD:/w" postgres:18 \
            sh -c 'psql "$BI_DATABASE_URL" -X -f /w/q.sql > /w/saida.txt 2>&1 || true'
          openssl rand -hex 32 > k.txt
          gzip -9 -k saida.txt; openssl enc -aes-256-cbc -pbkdf2 -salt -in saida.txt.gz -out saida.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/diag/diag-pub.pem -in k.txt -out k.enc
          echo "=== K ==="; base64 -w0 k.enc; echo
          echo "=== D ==="; base64 -w 3000 saida.enc; echo "=== FIMD ==="
          echo "=== FIM ==="
          wc -c saida.txt
