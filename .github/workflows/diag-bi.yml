name: Diag banco do BI
on:
  push:
    branches: [diag/bi-schema]
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler estrutura e amostras (saída criptografada)
        env:
          BI_URL_BASE: ${{ secrets.BI_DATABASE_URL }}
        run: |
          export BI_DATABASE_URL=$(echo "$BI_URL_BASE" | sed -E 's#/[^/?]+(\?|$)#/pedidos\1#')
          test -n "$BI_DATABASE_URL" || { echo "secret BI_DATABASE_URL vazio"; exit 1; }
          cat > q.sql <<'SQL'
          \pset pager off
          \echo === ref 19/10 e 12/10 ===
          SELECT id_operacao, data_inicio, conversao, novos_clientes, tempo_entrega, tempo_aberto FROM silver.fato_metricas_periodo
          WHERE id_plataforma = 1 AND periodo_tipo='SEMANAL' AND id_operacao IN (1,2,3,4,26,39) AND data_inicio IN ('2026-10-12','2026-10-19') ORDER BY 1,2;
          \echo === tipos ===
          SELECT column_name, data_type, numeric_precision, numeric_scale FROM information_schema.columns WHERE table_schema='silver' AND table_name='fato_metricas_periodo' AND column_name IN ('conversao','novos_clientes','tempo_entrega','tempo_aberto');
          SQL
          docker run --rm -e BI_DATABASE_URL -v "$PWD:/w" postgres:18 \
            sh -c 'psql "$BI_DATABASE_URL" -X -f /w/q.sql > /w/saida.txt 2>&1 || true'
          openssl rand -hex 32 > k.txt
          gzip -9 -k saida.txt; openssl enc -aes-256-cbc -pbkdf2 -salt -in saida.txt.gz -out saida.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/diag/diag-pub.pem -in k.txt -out k.enc
          echo "=== K ==="; base64 -w0 k.enc; echo
          echo "=== D ==="; base64 -w 3000 saida.enc; echo "=== FIMD ==="
          echo "=== FIM ==="
          wc -c saida.txt
